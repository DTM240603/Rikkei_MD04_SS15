spring:
  application:
    name: Gateway-Service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: course-service
              uri: ${COURSE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/courses/**

security:
  jwt:
    secret: ${JWT_SECRET:identity-service-development-secret-key-change-me}
