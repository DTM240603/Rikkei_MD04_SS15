spring:
  application:
    name: Identity-Service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET:identity-service-development-secret-key-change-me}
